name: ci
on: [push, pull_request]
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm test
        working-directory: app
      - run: pnpm check
        working-directory: app
      # one version everywhere: VERSION, the app and the Rust shell
      - run: node scripts/version.mjs check
      - run: node --test scripts/version.test.mjs
      - run: node scripts/check-portability.mjs
      - run: node --test scripts/check-portability.test.mjs
